name: Build JARVIS for Intel Mac

on:
  push:
    branches:
      - jarvis-assistant-v1
    paths:
      - "src/**"
      - "desktop/**"
      - "package.json"
      - "index.html"
      - "vite.config.ts"
      - ".github/workflows/build-mac.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-x64:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Intel Mac DMG
        run: npm run dist:mac
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-macOS-Intel
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14
